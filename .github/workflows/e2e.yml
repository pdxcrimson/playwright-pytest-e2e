name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run nightly at 2am UTC against staging
    - cron: "0 2 * * *"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - run: uv run black --check .
      - run: uv run flake8 . --max-line-length=100 --ignore=E501,W503
      - run: uv run isort --check-only --profile=black .

  test:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://www.saucedemo.com' }}
          HEADLESS: "true"
        run: |
          uv run pytest tests/ \
            --browser=${{ matrix.browser }} \
            -n auto \
            --alluredir=reports/allure-results \
            --html=reports/report-${{ matrix.browser }}.html \
            --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.browser }}
          path: reports/
          retention-days: 30

  allure-report:
    name: Publish Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: all-reports/
      - name: Merge Allure results
        run: |
          mkdir -p reports/allure-results
          find all-reports/ -name "*.json" -exec cp {} reports/allure-results/ \;
      - uses: simple-elf/allure-report-action@master
        with:
          allure_results: reports/allure-results
          gh_pages: gh-pages
          allure_report: allure-report
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report